apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: QuestDB
    type: postgres
    access: proxy
    url: questdb.railway.internal:8812
    user: admin
    database: main
    jsonData:
      sslmode: "disable"
      postgresVersion: 1200
      timescaledb: false
    secureJsonData:
      password: quest
