apiVersion: 1

datasources:
  - name: QuestDB
    type: postgres
    uid: QuestDB
    access: proxy
    url: questdb:8812
    user: admin
    database: main
    jsonData:
      sslmode: "disable"
      postgresVersion: 1200
      timescaledb: false
    secureJsonData:
      password: quest
    isDefault: true

  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false

  - name: Loki
    type: loki
    uid: Loki
    access: proxy
    url: http://loki:3100
    editable: false
