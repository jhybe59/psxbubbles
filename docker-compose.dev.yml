version: "3.9"

services:
  # QuestDB for time-series data (minute_bars)
  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000" # HTTP/REST API & Web Console
      - "9009:9009" # ILP (High-speed ingestion)
      - "8812:8812" # PostgreSQL Wire Protocol
    environment:
      QDB_TELEMETRY_ENABLED: "false"
    volumes:
      - questdb-data:/var/lib/questdb

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ./config/dev.env
    environment:
      NODE_ENV: development
      API_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - questdb
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - ./config/dev.env
    environment:
      NODE_ENV: development
    depends_on:
      - questdb
      - redis
    ports:
      - "9100:9100"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  questdb-data:
