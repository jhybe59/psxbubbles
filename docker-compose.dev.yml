version: "3.9"

services:
  timescale:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: cryptobubbles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ./config/dev.env
    environment:
      NODE_ENV: development
      API_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - timescale
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - ./config/dev.env
    environment:
      NODE_ENV: development
    depends_on:
      - timescale
      - redis
    # Expose Prometheus metrics from worker (METRICS_PORT=9100)
    ports:
      - "9100:9100"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  timescale-data:

