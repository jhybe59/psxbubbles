[project]
name = "psxbubbles"

# Monorepo: three services - web (vite static), api (dockerfile), worker (dockerfile)

[[services]]
name = "web"
builder = "NIXPACKS"
startCommand = "npm run preview"
# Ensure devDependencies (vite) are available during build on Railway
[services.env]
NIXPACKS_PRUNE_DEV_DEPENDENCIES = "false"

[[services]]
name = "api"
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[[services]]
name = "worker"
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[[services]]
name = "ml-service"
builder = "DOCKERFILE"
dockerfilePath = "ml_service/Dockerfile"
startCommand = "uvicorn inference:app --host 0.0.0.0 --port 8000"
