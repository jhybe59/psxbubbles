[project]
name = "psxbubbles"

# Monorepo: three services - web (vite static), api (dockerfile), worker (dockerfile)

[[services]]
name = "web"
builder = "NIXPACKS"
startCommand = "npm run preview"
# Ensure devDependencies (vite) are available during build on Railway
[services.env]
NIXPACKS_PRUNE_DEV_DEPENDENCIES = "false"

[[services]]
name = "api"
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[[services]]
name = "worker"
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[[services]]
name = "ml-service"
builder = "DOCKERFILE"
dockerfilePath = "ml_service/Dockerfile.railway"
startCommand = "uvicorn inference:app --host 0.0.0.0 --port 8000"

[[services]]
name = "prometheus"
builder = "DOCKERFILE"
dockerfilePath = "monitoring/Dockerfile"

[[services]]
name = "grafana"
builder = "DOCKERFILE"
dockerfilePath = "monitoring/Dockerfile.grafana"

[[services]]
name = "alertmanager"
builder = "DOCKERFILE"
dockerfilePath = "monitoring/Dockerfile.alertmanager"
startCommand = "--config.file=/etc/alertmanager/alertmanager.yml"

[[services]]
name = "loki"
builder = "DOCKERFILE"
dockerfilePath = "monitoring/Dockerfile.loki"
startCommand = "-config.file=/etc/loki/local-config.yaml"
